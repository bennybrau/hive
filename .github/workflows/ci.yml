name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  service:
    name: service (typecheck + tests vs pgvector)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: hive
          POSTGRES_PASSWORD: hive
          POSTGRES_DB: hive_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hive -d hive_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      HIVE_TEST_DATABASE_URL: postgres://hive:hive@127.0.0.1:5432/hive_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # M3 tests build real git repos and extract real PDFs
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - run: pnpm --filter hive test

  image:
    name: docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/hive/Dockerfile -t hive:ci .

  plugin:
    name: hermes plugin (pytest vs pinned hermes-agent)
    runs-on: ubuntu-latest
    # The Hermes commit the plugin is tested against is plugins/hive/HERMES_REF (bump deliberately when
    # Hermes' MemoryProvider changes). With no Hermes on the runner, test-plugin.sh provisions that commit
    # itself: the same path the ASF worker takes, so CI proves it.
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: scripts/test-plugin.sh
