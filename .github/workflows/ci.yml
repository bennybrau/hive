name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  service:
    name: service (typecheck + tests vs pgvector)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: hive
          POSTGRES_PASSWORD: hive
          POSTGRES_DB: hive_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hive -d hive_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      HIVE_TEST_DATABASE_URL: postgres://hive:hive@127.0.0.1:5432/hive_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # M3 tests build real git repos and extract real PDFs
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - run: pnpm --filter hive test

  image:
    name: docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/hive/Dockerfile -t hive:ci .

  plugin:
    name: hermes plugin (pytest vs pinned hermes-agent)
    runs-on: ubuntu-latest
    env:
      # Hermes commit the plugin is tested against. Bump deliberately when Hermes' MemoryProvider changes.
      HERMES_REF: 66605471e9f
      HERMES_AGENT_DIR: ${{ github.workspace }}/.hermes-agent
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: checkout hermes-agent @ HERMES_REF
        run: |
          git clone --filter=blob:none https://github.com/NousResearch/hermes-agent.git "$HERMES_AGENT_DIR"
          git -C "$HERMES_AGENT_DIR" checkout --quiet "$HERMES_REF"
      - name: install hermes-agent (locked)
        working-directory: ${{ env.HERMES_AGENT_DIR }}
        run: uv sync --frozen
      - run: scripts/test-plugin.sh
