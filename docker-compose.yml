# Hive stack. Separate from ASF on purpose: own project name, own volume, own Postgres.
name: hive

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: hive
      POSTGRES_DB: hive
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (scripts/setup.sh generates one)}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    # Host port for tests and psql; loopback only.
    ports:
      - "127.0.0.1:${HIVE_PG_PORT:-5544}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hive -d hive"]
      interval: 2s
      timeout: 3s
      retries: 30

  hive:
    build:
      context: .
      dockerfile: apps/hive/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://hive:${POSTGRES_PASSWORD}@postgres:5432/hive
      HIVE_HOST: 0.0.0.0
      HIVE_PORT: 8800
      # Ollama runs natively on the host (Metal GPU); empty OLLAMA_URL = keyword-only search.
      OLLAMA_URL: ${OLLAMA_URL-http://host.docker.internal:11434}
      HIVE_EMBED_MODEL: ${HIVE_EMBED_MODEL:-nomic-embed-text}
      HIVE_VECTOR_MIN_SIM: ${HIVE_VECTOR_MIN_SIM:-0.55}
    # Docker Desktop (Mac) resolves host.docker.internal to the host itself. Do NOT add
    # extra_hosts: host-gateway here - it overrides that with the bridge IP and Ollama
    # (bound to 127.0.0.1) becomes unreachable. On a Linux host, set OLLAMA_URL in .env instead.
    # HIVE_BIND=0.0.0.0 (or a Tailscale IP) in .env to let other machines' Hermes connect.
    ports:
      - "${HIVE_BIND:-127.0.0.1}:${HIVE_PORT:-8800}:8800"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8800/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
