# Hive stack from the published images: needs only this file and a .env next to it (no checkout, no build).
# Download both from a GitHub release; see README "Install (no checkout)".
name: hive

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: hive
      POSTGRES_DB: hive
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (openssl rand -hex 24)}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hive -d hive"]
      interval: 2s
      timeout: 3s
      retries: 30

  hive:
    image: ${HIVE_IMAGE:-ghcr.io/bennybrau/hive}:${HIVE_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://hive:${POSTGRES_PASSWORD}@postgres:5432/hive
      HIVE_HOST: 0.0.0.0
      HIVE_PORT: 8800
      # Ollama on the host by default; empty OLLAMA_URL = keyword-only search. Bundled Ollama instead:
      # OLLAMA_URL=http://ollama:11434 and `docker compose --profile ollama up -d`.
      OLLAMA_URL: ${OLLAMA_URL-http://host.docker.internal:11434}
      HIVE_EMBED_MODEL: ${HIVE_EMBED_MODEL:-nomic-embed-text}
      HIVE_VECTOR_MIN_SIM: ${HIVE_VECTOR_MIN_SIM:-0.55}
      # Repos to ingest/verify live under HIVE_REPOS_HOST_ROOT on the host, mounted read-only at /repos.
      # Unset = an empty named volume (no repos; facts and search still work).
      HIVE_REPOS_ROOT: /repos
      HIVE_REPOS_HOST_ROOT: ${HIVE_REPOS_HOST_ROOT:-/repos}
      # Repos registered by URL are cloned here (the hive-clones volume) and fetched before each ingest.
      HIVE_CLONES_ROOT: /data/repos
      HIVE_REPO_SYNC_MINUTES: ${HIVE_REPO_SYNC_MINUTES:-15}
      HIVE_SECRET_KEY: ${HIVE_SECRET_KEY:-}
      HIVE_WEBHOOK_MAX_ATTEMPTS: ${HIVE_WEBHOOK_MAX_ATTEMPTS:-6}
      HIVE_WEBHOOK_BACKOFF_SECONDS: ${HIVE_WEBHOOK_BACKOFF_SECONDS:-30}
      HIVE_STALE_DAYS: ${HIVE_STALE_DAYS:-60}
    volumes:
      - ${HIVE_REPOS_HOST_ROOT:-hive-repos}:/repos:ro
      - hive-clones:/data/repos
    # Docker Desktop (Mac) resolves host.docker.internal to the host itself. On a Linux host, set OLLAMA_URL in .env.
    ports:
      - "${HIVE_BIND:-127.0.0.1}:${HIVE_PORT:-8800}:8800"
    # Healthcheck: built into the image (GET /health).

  # The fact agent. Healthcheck built into the image (heartbeat file).
  hive-worker:
    image: ${HIVE_WORKER_IMAGE:-ghcr.io/bennybrau/hive-worker}:${HIVE_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      hive:
        condition: service_healthy
    environment:
      HIVE_URL: http://hive:8800
      # A `worker` role token (see README). Empty = the worker logs that and idles.
      HIVE_TOKEN: ${HIVE_WORKER_TOKEN:-}
      HIVE_DISTILL_RUNNER: ${HIVE_DISTILL_RUNNER:-claude}
      HIVE_DISTILL_MODEL: ${HIVE_DISTILL_MODEL:-}
      OLLAMA_URL: ${OLLAMA_URL-http://host.docker.internal:11434}

  # Nightly pg_dump into the hive-backups volume (or HIVE_BACKUP_DIR), with retention; see README "Backups".
  # The script is scripts/backup.sh, embedded so this file needs no checkout (every $ written $$).
  # Run one now: docker compose run --rm --no-deps -T backup once
  backup:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ:-UTC}
      HIVE_BACKUP_TIME: ${HIVE_BACKUP_TIME:-03:00}
      HIVE_BACKUPS: ${HIVE_BACKUPS:-on}
      HIVE_BACKUP_COPY_DIR: ${HIVE_BACKUP_COPY_DIR:-}
      HIVE_BACKUP_SH: |
        #!/bin/sh
        # Hive's nightly pg_dump, run by the compose `backup` service. Both compose files embed a copy of this file as
        # HIVE_BACKUP_SH (every $$ written $$$$); scripts/backup.test.sh checks the copies match it.
        #
        #   loop            sleep until HIVE_BACKUP_TIME (default 03:00, in TZ, default UTC), run `once`, repeat;
        #                   HIVE_BACKUPS=off idles instead
        #   once            dump to /backups/hive-YYYYMMDD-HHMM.dump (and /backups-copy when HIVE_BACKUP_COPY_DIR is
        #                   set), then apply retention to both
        #   keep YYYYMMDD   file names on stdin -> the ones retention keeps on that date
        #   newest          "<age seconds> <file>" of the newest dump, or "none"
        #
        # Any caller: docker compose run --rm --no-deps -T backup <subcommand>
        set -u

        BACKUPS=$${BACKUPS:-/backups}
        BACKUPS_COPY=$${BACKUPS_COPY:-/backups-copy}
        NAME_RE='^hive-[0-9]{8}-[0-9]{4}\.dump$$'
        export LC_ALL=C

        log() { printf '%s backup: %s\n' "$$(date '+%Y-%m-%dT%H:%M:%S%z')" "$$*" >&2; }

        # YYYYMMDD -> days since 1970-01-01 (days_from_civil), so no `date -d` is needed.
        day_number() {
          y=$${1%????}; m=$${1#????}; m=$${m%??}; d=$${1#??????}
          m=$${m#0}; d=$${d#0}
          [ "$$m" -le 2 ] && y=$$((y - 1))
          era=$$((y / 400)); yoe=$$((y - era * 400))
          doy=$$(( (153 * (m > 2 ? m - 3 : m + 9) + 2) / 5 + d - 1 ))
          doe=$$((yoe * 365 + yoe / 4 - yoe / 100 + doy))
          echo $$((era * 146097 + doe - 719468))
        }

        # Keep the newest dump of each of the 7 days ending on $$1, of each Sunday among the 28 days ending on $$1, and the
        # newest dump overall. Names that aren't exactly hive-YYYYMMDD-HHMM.dump are not printed (and never deleted).
        cmd_keep() {
          case "$${1:-}" in [0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]) ;; *) echo "keep: want a date YYYYMMDD" >&2; return 2 ;; esac
          today=$$(day_number "$$1")
          grep -E "$$NAME_RE" | sort -r | {
            first=1 seen=" "
            while IFS= read -r f; do
              date=$${f#hive-}; date=$${date%%-*}
              keep=$$first; first=0
              case "$$seen" in *" $$date "*) ;; *)
                seen="$$seen$$date "
                n=$$(day_number "$$date"); age=$$((today - n))
                if [ "$$age" -ge 0 ] && [ "$$age" -lt 7 ]; then keep=1
                elif [ "$$age" -ge 0 ] && [ "$$age" -lt 28 ] && [ $$(((n + 4) % 7)) -eq 0 ]; then keep=1; fi
              esac
              [ "$$keep" = 1 ] && printf '%s\n' "$$f"
            done
          }
          return 0
        }

        # Delete the dumps in $$1 that retention doesn't keep today.
        prune() {
          list=$$(ls -1A "$$1") || return 1
          keep=$$(printf '%s\n' "$$list" | cmd_keep "$$(date +%Y%m%d)")
          [ -n "$$keep" ] || return 0
          printf '%s\n' "$$list" | grep -E "$$NAME_RE" | while IFS= read -r f; do
            case "
        $$keep
        " in *"
        $$f
        "*) ;; *) rm -f "$$1/$$f" && log "pruned $$1/$$f" ;; esac
          done
        }

        # A subshell, so the umask and the trap end with it.
        cmd_once() (
          umask 077
          start=$$(date +%s)
          name="hive-$$(date +%Y%m%d-%H%M).dump"
          tmp="$$BACKUPS/.$$name.tmp" ctmp=""
          trap 'rm -f "$$tmp" $${ctmp:+"$$ctmp"}' EXIT
          trap 'exit 1' INT TERM
          if ! pg_dump -Fc -h postgres -U hive -d hive -f "$$tmp"; then
            log "pg_dump failed; no dump written"
            exit 1
          fi
          mv "$$tmp" "$$BACKUPS/$$name" || { log "cannot rename $$tmp"; exit 1; }
          rc=0
          if [ -n "$${HIVE_BACKUP_COPY_DIR:-}" ]; then
            ctmp="$$BACKUPS_COPY/.$$name.tmp"
            if cp "$$BACKUPS/$$name" "$$ctmp" && mv "$$ctmp" "$$BACKUPS_COPY/$$name"; then
              prune "$$BACKUPS_COPY" || rc=1
            else
              log "cannot copy $$name into $$BACKUPS_COPY"; rc=1
            fi
          fi
          prune "$$BACKUPS" || rc=1
          size=$$(wc -c < "$$BACKUPS/$$name" | tr -d ' ')
          log "wrote $$BACKUPS/$$name ($$size bytes, $$(($$(date +%s) - start)) s)$${HIVE_BACKUP_COPY_DIR:+, copied to $$BACKUPS_COPY}"
          exit "$$rc"
        )

        cmd_newest() {
          list=$$(ls -1A "$$BACKUPS") || return 1
          f=$$(printf '%s\n' "$$list" | grep -E "$$NAME_RE" | sort | tail -n 1)
          [ -n "$$f" ] || { echo none; return 0; }
          mtime=$$(stat -c %Y "$$BACKUPS/$$f" 2>/dev/null || stat -f %m "$$BACKUPS/$$f") || return 1
          echo "$$(($$(date +%s) - mtime)) $$f"
        }

        # Seconds from now until the next $$1 (HH:MM) on this clock; a time that is now or past means tomorrow's.
        seconds_until() {
          h=$${1%:*}; m=$${1#*:}; h=$${h#0}; m=$${m#0}
          set -- $$(date '+%H %M %S')
          now=$$(($${1#0} * 3600 + $${2#0} * 60 + $${3#0}))
          s=$$((h * 3600 + m * 60 - now))
          [ "$$s" -gt 0 ] || s=$$((s + 86400))
          echo "$$s"
        }

        cmd_loop() {
          if [ "$${HIVE_BACKUPS:-on}" = off ]; then
            log "backups off"
            exec sleep infinity
          fi
          at=$${HIVE_BACKUP_TIME:-03:00}
          case "$$at" in [01][0-9]:[0-5][0-9]|2[0-3]:[0-5][0-9]) ;; *) log "HIVE_BACKUP_TIME='$$at' is not HH:MM; using 03:00"; at=03:00 ;; esac
          log "nightly at $$at (TZ $${TZ:-UTC}) into $$BACKUPS"
          while :; do
            sleep "$$(seconds_until "$$at")"
            cmd_once || log "backup failed; next one at $$at"
          done
        }

        case "$${1:-}" in
          loop) cmd_loop ;;
          once) cmd_once ;;
          keep) shift; cmd_keep "$$@" ;;
          newest) cmd_newest ;;
          *) echo "usage: backup.sh loop|once|keep <YYYYMMDD>|newest" >&2; exit 2 ;;
        esac
    entrypoint: ["sh", "-c", "printf '%s' \"$$HIVE_BACKUP_SH\" > /tmp/hive-backup && exec sh /tmp/hive-backup \"$$@\"", "hive-backup"]
    command: [loop]
    volumes:
      - ${HIVE_BACKUP_DIR:-hive-backups}:/backups
      - ${HIVE_BACKUP_COPY_DIR:-hive-backups-copy}:/backups-copy

  # Opt-in: `docker compose --profile ollama up -d`, then `docker compose exec ollama ollama pull nomic-embed-text`.
  ollama:
    image: ollama/ollama
    profiles: [ollama]
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama

volumes:
  pgdata:
  hive-repos:
  hive-backups:
  hive-backups-copy:
  hive-clones:
  ollama:
